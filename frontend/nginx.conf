server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep uploads bounded at the proxy as well as in the API.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # API requests are proxied to the backend container. The trailing slash on
    # proxy_pass strips the /api prefix, matching the FastAPI route names.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: every unknown path falls back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
